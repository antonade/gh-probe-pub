name: artifact-version-cmp
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'EOF'
          import zipfile
          z=zipfile.ZipFile('/tmp/h3.zip','w',zipfile.ZIP_DEFLATED)
          z.writestr('normal.txt','VER_NORMAL_88bb\n')
          z.writestr('a/../../ESCAPED.txt','VER_ESCAPED_88bb\n')
          z.close()
          EOF
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), crypto=require('crypto');
            const tok=process.env.ACTIONS_RUNTIME_TOKEN, base=process.env.ACTIONS_RESULTS_URL;
            const claims=JSON.parse(Buffer.from(tok.split('.')[1],'base64').toString());
            const m=(claims.scp||"").match(/Actions\.Results:([0-9a-f-]+):([0-9a-f-]+)/i);
            const ids={workflow_run_backend_id:m[1], workflow_job_run_backend_id:m[2]};
            const c=await (await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"vercmp",version:4})})).json();
            const data=fs.readFileSync('/tmp/h3.zip');
            const blk=Buffer.from("blk1").toString('base64');
            await fetch(c.signed_upload_url+"&comp=block&blockid="+blk,{method:"PUT",headers:{"x-ms-blob-type":"BlockBlob"},body:data});
            await fetch(c.signed_upload_url+"&comp=blocklist",{method:"PUT",headers:{"Content-Type":"application/xml"},
              body:'<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>'+blk+'</Latest></BlockList>'});
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            const f=await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"vercmp",size:data.length,hash:"sha256:"+sha})});
            core.info("FINALIZE="+f.status);
  consume_v4:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p /home/runner/work/v4/dl
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: vercmp, path: /home/runner/work/v4/dl }
      - run: |
          echo "V4 escaped=$(test -f /home/runner/work/v4/ESCAPED.txt && echo YES || echo no)"
          echo "V4 inside =$(test -f /home/runner/work/v4/dl/normal.txt && echo YES || echo no)"
  consume_v8:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p /home/runner/work/v8/dl
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with: { name: vercmp, path: /home/runner/work/v8/dl }
      - run: |
          echo "V8 escaped=$(test -f /home/runner/work/v8/ESCAPED.txt && echo YES || echo no)"
          echo "V8 inside =$(test -f /home/runner/work/v8/dl/normal.txt && echo YES || echo no)"
