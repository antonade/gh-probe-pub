name: reuse-writer2
on:
  workflow_call:
permissions:
  contents: write
  issues: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CALLED_RAN"
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/labels \
            -d '{"name":"reuse2-${{ github.run_id }}","color":"123456"}')
          echo "LABEL_WRITE_HTTP=$code"
          head -c 100 out.txt; echo
