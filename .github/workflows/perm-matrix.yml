name: perm-matrix
on: workflow_dispatch
env:
  DEP: https://api.github.com/repos/antonade/gh-probe-pub/actions/runners/deprecations/2.337.0
  ALERTS: https://api.github.com/repos/antonade/gh-probe-pub/dependabot/alerts?per_page=1
  META: https://api.github.com/repos/antonade/gh-probe-pub
  APERM: https://api.github.com/repos/antonade/gh-probe-pub/actions/permissions
jobs:
  p-none:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          for u in "$DEP" "$ALERTS" "$META" "$APERM"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "$u")
            echo "RESULT none $(echo $u | sed 's|.*gh-probe-pub||') $c"
          done
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
  p-contents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          for u in "$DEP" "$ALERTS" "$META" "$APERM"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "$u")
            echo "RESULT contents $(echo $u | sed 's|.*gh-probe-pub||') $c"
          done
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
  p-actions:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - run: |
          for u in "$DEP" "$ALERTS" "$META" "$APERM"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "$u")
            echo "RESULT actions $(echo $u | sed 's|.*gh-probe-pub||') $c"
          done
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
  p-vulnalerts:
    runs-on: ubuntu-latest
    permissions:
      vulnerability-alerts: read
    steps:
      - run: |
          for u in "$DEP" "$ALERTS" "$META" "$APERM"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "$u")
            echo "RESULT vulnalerts $(echo $u | sed 's|.*gh-probe-pub||') $c"
          done
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
  p-writeall:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: |
          for u in "$DEP" "$ALERTS" "$META" "$APERM"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" -H "Accept: application/vnd.github+json" "$u")
            echo "RESULT write-all $(echo $u | sed 's|.*gh-probe-pub||') $c"
          done
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
