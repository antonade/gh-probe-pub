name: scope-matrix
on:
  workflow_dispatch:
  push:

jobs:
  p-none:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: none

  p-contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: contents-read

  p-issues-read:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: issues-read

  p-issues-write:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: issues-write

  p-pr-read:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: pr-read

  p-actions-read:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: actions-read

  p-write-all:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: curl -sSL -o probe.py https://raw.githubusercontent.com/antonade/gh-probe-pub/main/probe.py
      - run: python3 probe.py
        env:
          PROBE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_LABEL: write-all
