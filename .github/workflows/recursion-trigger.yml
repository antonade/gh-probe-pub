name: recursion-trigger
on: { push: { branches: [rectrigger] } }
permissions:
  contents: write
  actions: write
jobs:
  fire:
    runs-on: ubuntu-latest
    env: { T: "${{ secrets.GITHUB_TOKEN }}" }
    steps:
      - name: can GITHUB_TOKEN trigger new workflow runs?
        run: |
          REPO=${{ github.repository }}
          echo "--- repository_dispatch ---"
          echo "RD_HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" \
            https://api.github.com/repos/$REPO/dispatches -d '{"event_type":"probe"}')"
          echo "--- workflow_dispatch ---"
          echo "WD_HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $T" \
            https://api.github.com/repos/$REPO/actions/workflows/recursion-target.yml/dispatches -d '{"ref":"main"}')"
          echo "--- push to a branch the target watches ---"
          B64=$(printf 'tok push %s\n' "$GITHUB_RUN_ID" | base64 -w0)
          SHA=$(curl -s -H "Authorization: Bearer $T" https://api.github.com/repos/$REPO/git/ref/heads/rectarget | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('object',{}).get('sha',''))")
          echo "PUSH_HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" \
            https://api.github.com/repos/$REPO/contents/tokpush-$GITHUB_RUN_ID.txt \
            -d "{\"message\":\"token push\",\"branch\":\"rectarget\",\"content\":\"$B64\"}")"
