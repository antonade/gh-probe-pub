name: action-token-probe
on: { push: { branches: [actprobe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p o && echo x > o/a.txt
      - uses: actions/upload-artifact@v4
        with: { name: act-probe-art, path: o }
      - name: shell step baseline
        run: echo "SHELL_RUNTIME_TOKEN_SET=${ACTIONS_RUNTIME_TOKEN:+yes}${ACTIONS_RUNTIME_TOKEN:-no}"
      - uses: ./.github/actions/comp
      - uses: ./.github/actions/js
