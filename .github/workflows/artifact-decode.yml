name: artifact-decode
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p d && echo "DECODE_CANARY_55ee" > d/f.txt
      - uses: actions/upload-artifact@v4
        with:
          name: "dot%2e%2e%2fslash"
          path: d
      - uses: actions/upload-artifact@v4
        with:
          name: "con"
          path: d
      - uses: actions/upload-artifact@v4
        with:
          name: "tab	name"
          path: d
        continue-on-error: true
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p /home/runner/work/target && echo "before" > /home/runner/work/target/marker
      - uses: actions/download-artifact@v4
        with:
          path: /home/runner/work/target/dl
      - name: where did files land
        run: |
          echo "--- tree under the download root ---"
          find /home/runner/work/target -maxdepth 4 | sed 's|^|  |'
          echo "--- anything OUTSIDE the download root? ---"
          find /home/runner/work -maxdepth 2 -newer /home/runner/work/target/marker 2>/dev/null | grep -v '/target/dl' | sed 's|^|  OUT |' || true
          echo "--- canary locations ---"
          grep -rl DECODE_CANARY_55ee /home/runner/work 2>/dev/null | sed 's|^|  HIT |'
