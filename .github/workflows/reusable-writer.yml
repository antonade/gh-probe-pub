name: reusable-writer
on:
  workflow_call:
permissions:
  contents: write
  issues: write
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - name: what did the called workflow actually get?
        env: { T: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "CALLED_WORKFLOW_RUNNING"
          code=$(curl -s -o /tmp/o -w '%{http_code}' -X POST -H "Authorization: Bearer $T" \
            https://api.github.com/repos/${{ github.repository }}/labels \
            -d "{\"name\":\"reuse-${{ github.run_id }}-$RANDOM\",\"color\":\"123456\"}")
          echo "LABEL_WRITE_HTTP=$code"
          head -c 110 /tmp/o; echo
