name: xrepo-cache
on:
  workflow_dispatch:
    inputs:
      mode: { description: write or read, required: true, default: read }
jobs:
  c:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "REPO=${{ github.repository }} MODE=${{ inputs.mode }}"
      - name: seed
        if: inputs.mode == 'write'
        run: mkdir -p cdir && echo "XREPO_CACHE_CANARY_4c8e from ${{ github.repository }}" > cdir/secret.txt
      - name: SAVE
        if: inputs.mode == 'write'
        uses: actions/cache/save@v4
        with: { path: cdir, key: xrepo-shared-key-v1 }
      - name: RESTORE
        if: inputs.mode == 'read'
        id: r
        uses: actions/cache/restore@v4
        with: { path: cdir, key: xrepo-shared-key-v1 }
      - name: report
        if: inputs.mode == 'read'
        run: |
          echo "cache-hit: ${{ steps.r.outputs.cache-hit }}"
          echo "matched-key: ${{ steps.r.outputs.cache-matched-key }}"
          if [ -f cdir/secret.txt ]; then echo "RESULT=RESTORED"; echo "PAYLOAD=$(cat cdir/secret.txt)"; else echo "RESULT=MISS"; fi
