name: runtime-token2
on: { push: { branches: [rtprobe2] } }
jobs:
  rt:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: mkdir -p o && echo x > o/a.txt
      - uses: actions/upload-artifact@v4
        with: { name: rt2-artifact, path: o }
      - name: census of ACTIONS_* in a shell step
        run: |
          echo "VISIBLE_ACTIONS_VARS:"
          env | grep -o '^ACTIONS_[A-Z_]*' | sort | sed 's/^/  /'
          echo "RUNTIME_TOKEN_SET=${ACTIONS_RUNTIME_TOKEN:+yes}${ACTIONS_RUNTIME_TOKEN:-no}"
          echo "RESULTS_URL_SET=${ACTIONS_RESULTS_URL:+yes}"
          echo "IDTOKEN_REQ_SET=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-no}"
