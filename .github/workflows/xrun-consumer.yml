name: xrun-consumer
on:
  workflow_run:
    workflows: ["xrun-producer"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: separate run, set up a build script
        run: |
          mkdir -p /home/runner/work/x/dl
          printf '#!/bin/bash\necho "ORIGINAL_CONSUMER_SCRIPT"\n' > /home/runner/work/x/build.sh
          chmod +x /home/runner/work/x/build.sh
          echo "XRUN this_run=${{ github.run_id }} producer_run=${{ github.event.workflow_run.id }}"
          echo "XRUN sha_before=$(sha256sum /home/runner/work/x/build.sh | cut -c1-16)"
      - name: download from the OTHER run via run-id + github-token
        uses: actions/download-artifact@v4
        with:
          name: xrun-art
          path: /home/runner/work/x/dl
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: where did it land
        run: |
          echo "XRUN sha_after=$(sha256sum /home/runner/work/x/build.sh | cut -c1-16)"
          echo "XRUN tree:"; find /home/runner/work/x -maxdepth 3 | sed 's|^|  |'
          echo "XRUN executing consumer build script:"
          bash /home/runner/work/x/build.sh
