name: approve-pr
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: approve as github-actions[bot]
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr }}/reviews             -d '{"event":"APPROVE","body":"approved by github-actions[bot]"}')
          echo "APPROVE_HTTP=$code"
          head -c 400 /tmp/r.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
