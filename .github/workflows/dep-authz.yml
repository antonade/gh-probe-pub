name: dep-authz
on: workflow_dispatch
jobs:
  noperms:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: repo-scoped deprecations endpoint with a foreign token
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          V: "2.337.0"
        run: |
          probe () {
            printf '%-38s -> ' "$1"
            curl -s -o /tmp/o.json -w "%{http_code}" -H "Authorization: Bearer $GH" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$2/actions/runners/deprecations/$V"
            printf '  %s\n' "$(head -c 90 /tmp/o.json | tr -d '\n')"
          }
          echo "=== token reach control ==="
          curl -s -o /dev/null -w "api gh-probe-pub  -> %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/antonade/gh-probe-pub
          curl -s -o /dev/null -w "api gh-probe-a    -> %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/antonade/gh-probe-a
          echo "=== deprecations endpoint ==="
          probe "OWN repo (control)"      "antonade/gh-probe-pub"
          probe "PRIVATE no-access"       "antonade/gh-probe-a"
          probe "NONEXISTENT"             "antonade/nope-xyz-123"
          probe "SOMEONE ELSE public"     "cli/cli"
          probe "SOMEONE ELSE private?"   "github/github"
