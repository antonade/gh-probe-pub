name: artifact-overwrite
on: { push: { branches: [artover] } }
jobs:
  producer:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: mkdir -p out && echo "PRODUCER_CANARY_a11a trusted build output" > out/payload.txt
      - uses: actions/upload-artifact@v4
        with: { name: shared-artifact, path: out }
      - run: echo "PRODUCER_UPLOADED=yes"
  attacker:
    needs: producer
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: try to overwrite another job's artifact under the same name
        run: mkdir -p out && echo "ATTACKER_CANARY_b22b overwritten" > out/payload.txt
      - id: up
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: { name: shared-artifact, path: out, overwrite: true }
      - run: echo "ATTACKER_UPLOAD_OUTCOME=${{ steps.up.outcome }}"
  consumer:
    needs: attacker
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: shared-artifact, path: got }
      - run: |
          echo "CONSUMER_SEES:"
          cat got/payload.txt
