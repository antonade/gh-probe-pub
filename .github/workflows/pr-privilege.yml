name: pr-privilege
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: report the privilege this PR context was granted
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          S: ${{ secrets.PROBE_SECRET }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "CTX actor=${{ github.actor }}"
          echo "CTX event=${{ github.event_name }}"
          echo "CTX pr_author=${{ github.event.pull_request.user.login }}"
          echo "CTX head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          if [ -z "$S" ]; then echo "SECRET absent len=0"; else echo "SECRET PRESENT len=${#S}"; fi
          w=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/antonade/gh-probe-pub/issues/$PR/comments" \
            -d '{"body":"privilege probe: this token could write"}')
          echo "WRITE issue_comment -> $w"
          r=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/antonade/gh-probe-pub")
          echo "READ repo -> $r"
          s=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/antonade/gh-probe-pub/actions/secrets")
          echo "READ actions/secrets -> $s"
