name: reuse-writer3
on:
  workflow_call:
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CALLED_RAN"
          code=$(curl -s -o out.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }}/labels \
            -d '{"name":"rw3-${{ github.run_id }}","color":"654321"}')
          echo "LABEL_WRITE_HTTP=$code"
          head -c 90 out.txt; echo
