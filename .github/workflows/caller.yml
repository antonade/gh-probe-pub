name: caller
on: workflow_dispatch
jobs:
  reach:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: prove this job's token cannot read the private repo
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "api gh-probe-a   -> %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/antonade/gh-probe-a
          curl -s -o /dev/null -w "api gh-probe-pub -> %{http_code}\n" -H "Authorization: Bearer $GH" https://api.github.com/repos/antonade/gh-probe-pub
          curl -s -o /dev/null -w "raw reusable.yml -> %{http_code}\n" -H "Authorization: Bearer $GH" \
            https://api.github.com/repos/antonade/gh-probe-a/contents/.github/workflows/reusable.yml
  call-private:
    uses: antonade/gh-probe-a/.github/workflows/reusable.yml@main
  report:
    needs: call-private
    runs-on: ubuntu-latest
    steps:
      - run: echo "OUTPUT_FROM_PRIVATE=${{ needs.call-private.outputs.leaked }}"
